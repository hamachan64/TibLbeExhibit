<text x="470" y="180" font-size="26">配置と動線</text>
<text x="470" y="214" font-size="17">水色：搬出リフト（幅3m）</text>
<text x="470" y="248" font-size="17">青い四角：練習用の固定4点</text>
<text x="470" y="282" font-size="17">黄色の点：お宝候補28点</text>
<text x="470" y="316" font-size="17">点線円：半径0.27mの配置余裕</text>
<text x="470" y="350" font-size="17">中央の緑：幅1.2mの通路</text>
<text x="470" y="384" font-size="17">灰色：高さ0.8m未満の障害物</text>
<text x="470" y="418" font-size="17"></text>
<text x="470" y="452" font-size="17">境界から0.7mは配置除外</text>
<text x="470" y="486" font-size="15">警告距離0.4m＋余白0.3mを仮定</text>
<text x="470" y="520" font-size="15">警告距離はUnity導入時に再確認</text>
<text x="470" y="554" font-size="17"></text>
<text x="470" y="588" font-size="17">4人用の例：S 14個＋M 9個</text>
<text x="470" y="622" font-size="15">候補は毎回ランダム選択する想定</text>
<text x="470" y="656" font-size="15">L・秘宝はコア配置に含めない</text>
<text x="470" y="690" font-size="17"></text>
<text x="470" y="724" font-size="17">原点：幅中央・入口端・床面</text>
<text x="470" y="758" font-size="15">Unity：X=幅、Y=高さ、Z=奥行き</text>
<text x="470" y="792" font-size="15">Blender：(X, -奥行き, 高さ)</text>
